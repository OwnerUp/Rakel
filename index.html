  <style>
    :root {
      --blue1:#0b42ff;
      --blue2:#17b7ff;
      --gold:#ffd86b;
      --white:#ffffff;
      --shadow:0 12px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        linear-gradient(rgba(9,20,58,.50), rgba(4,10,40,.65)),
        url('design.png') center top/cover no-repeat fixed,
        radial-gradient(circle at top, #2ea6ff 0%, #0b2a7a 45%, #061031 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .wrap {
      width: 100%;
      max-width: 430px;
    }
    .card {
      position: relative;
      border-radius: 34px;
      overflow: hidden;
      padding: 22px 18px 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .top-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.30), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(23,183,255,.25), transparent 26%);
      pointer-events: none;
    }
    .brand {
      text-align: center;
      margin-top: 6px;
      position: relative;
      z-index: 2;
    }
    .crown {
      font-size: 36px;
      line-height: 1;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.35));
      animation: floaty 2.2s ease-in-out infinite;
    }
    .brand-name {
      margin: 0;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: .9;
      color: #eef6ff;
      text-shadow:
        0 2px 0 #fff,
        0 4px 0 #8db5ff,
        0 6px 0 #3f6dff,
        0 10px 18px rgba(0,0,0,.45);
      transform-style: preserve-3d;
      animation: popPop 1.8s ease-in-out infinite;
    }
    .brand-sub {
      display:block;
      margin-top: 6px;
      font-size: 28px;
      color: #ffe9a8;
      text-shadow:
        0 1px 0 #fff0b9,
        0 3px 0 #be8a12,
        0 8px 14px rgba(0,0,0,.35);
      animation: popPop 2.1s ease-in-out infinite .15s;
    }
    .dp-zone {
      display: flex;
      justify-content: center;
      margin: 18px 0 22px;
      position: relative;
      z-index: 2;
    }
    .dp-ring {
      width: 232px;
      height: 232px;
      border-radius: 50%;
      padding: 7px;
      background: conic-gradient(from 0deg, #fff, #56c6ff, #fff, #ffc846, #fff);
      box-shadow:
        0 0 0 5px rgba(255,255,255,.15),
        0 0 32px rgba(23,183,255,.55),
        0 0 55px rgba(255,216,107,.30);
      animation: popPop 1.7s ease-in-out infinite;
      position: relative;
    }
    .dp-ring::before, .dp-ring::after {
      content: "❤";
      position: absolute;
      font-size: 24px;
      filter: drop-shadow(0 6px 10px rgba(255,0,120,.35));
      animation: heartFloat 2.6s ease-in-out infinite;
    }
    .dp-ring::before { left: -20px; top: 25%; }
    .dp-ring::after { right: -20px; top: 60%; animation-delay: 1.1s; }
    .dp {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      border: 4px solid rgba(255,255,255,.85);
      background: #fff;
    }
    .buttons {
      display: grid;
      gap: 14px;
      position: relative;
      z-index: 2;
    }
    .btn, .btn-static {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 78px;
      padding: 10px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(232,240,255,.92));
      color: #103c8f;
      box-shadow: 0 10px 24px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.95);
      border: 2px solid rgba(255,255,255,.78);
      transform-origin: center;
      animation: buttonPulse 2.2s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .btn::after, .btn-static::after {
      content:"";
      position:absolute;
      top:0;
      left:-110%;
      width:55%;
      height:100%;
      transform:skewX(-24deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.82), transparent);
      animation: shine 3.2s linear infinite;
    }
    .btn:hover { transform: translateY(-2px) scale(1.01); }
    .btn-icon {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, #ffeeb7, #ffc22c);
      font-size: 30px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.8), 0 8px 15px rgba(0,0,0,.18);
    }
    .btn-text {
      flex: 1;
      font-size: 21px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .3px;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
    }
    .btn-text span { color: #1c81ff; }
    .btn-arrow {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: 50%;
      background: linear-gradient(180deg, #42c3ff, #0561ff);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 34px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 8px 18px rgba(5,97,255,.42);
    }
    .join {
      margin-top: 16px;
      min-height: 92px;
      background: linear-gradient(180deg, #18b9ff, #024cff);
      color: #fff;
      border: 2px solid rgba(255,255,255,.35);
      animation: buttonPulse 1.8s ease-in-out infinite;
      cursor: pointer;
    }
    .join .btn-icon {
      background: linear-gradient(180deg, #52d5ff, #0ba2ff);
      color:#fff;
      font-size: 34px;
    }
    .join .btn-text {
      color:#fff;
      font-size: 26px;
      text-shadow: 0 2px 10px rgba(0,0,0,.18);
    }
    .join .btn-arrow {
      background: rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.18);
    }
    .note {
      text-align:center;
      font-size: 12px;
      color: rgba(255,255,255,.82);
      margin-top: 12px;
      letter-spacing: .2px;
      position: relative;
      z-index: 2;
    }
    @keyframes popPop {
      0%,100% { transform: scale(1); }
      18% { transform: scale(1.07); }
      30% { transform: scale(.985); }
      42% { transform: scale(1.05); }
      55% { transform: scale(1); }
    }
    @keyframes buttonPulse {
      0%,100% { transform: scale(1); }
      20% { transform: scale(1.025); }
      32% { transform: scale(.992); }
      44% { transform: scale(1.018); }
      58% { transform: scale(1); }
    }
    @keyframes floaty {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shine {
      0% { left:-110%; }
      100% { left:140%; }
    }
    @keyframes heartFloat {
      0%,100% { transform: translateY(0) scale(1); opacity:.95; }
      50% { transform: translateY(-10px) scale(1.08); opacity:1; }
    }
    @media (max-width: 420px) {
      .brand-name { font-size: 36px; }
      .brand-sub { font-size: 24px; }
      .dp-ring { width: 210px; height: 210px; }
      .btn-text { font-size: 19px; }
      .join .btn-text { font-size: 24px; }
    }
  </style>
</head>

      <div class="dp-zone">

      <div class="buttons">

        <a class="btn join" href="https://t.me/+eEXaQqkxFyFkNTZl" target="_blank" rel="noopener noreferrer">
          <div class="btn-icon">✈</div>
          <div class="btn-text">Join Now</div>
          <div class="btn-arrow">›</div>
        </a>
      </div>

      <div class="note">Link sirf JOIN NOW button me hai • DP roll nahi karega</div>
    </div>
  </div>
</body>
